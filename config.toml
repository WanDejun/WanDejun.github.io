[site]
title = "Neko Blog"
window_title = "neko@homepage: ~"
favicon = "resources/icon.png"

[terminal]
prompt = "neko:{cwd}$ "
theme = "gruvbox-dark"
font_family = "JetBrains Mono, SFMono-Regular, Consolas, Liberation Mono, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, Neko Emoji, Neko Nerd Symbols, monospace"
font_size = 15
cursor_blink = true
scrollback = 5000
max_width = 1120
height_percent = 90

[images]
timeout_ms = 10000
max_bytes = 8388608
max_width_cells = 80
